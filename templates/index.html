<!DOCTYPE html>
<html>
<head>
    <title>Maddy AI Tutor</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; }
        .container { max-width: 800px; margin: 50px auto; background: white; padding: 20px; border-radius: 10px; }
        h1 { color: #667eea; }
        .chat { height: 400px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; margin: 10px 0; background: #fafafa; }
        .message { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .user { background: #667eea; color: white; text-align: right; }
        .ai { background: #e0e0e0; text-align: left; }
        input { width: 100%; padding: 10px; }
        button { padding: 10px 20px; background: #667eea; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Maddy AI Tutor</h1>
        <p>Ask any question!</p>
        
        <div class="chat" id="chat"></div>
        
        <input type="text" id="question" placeholder="Type your question...">
        <button onclick="askQuestion()">Send</button>
    </div>

    <script>
        function askQuestion() {
            const question = document.getElementById('question').value;
            if (!question) return;
            
            // Show user message
            const chat = document.getElementById('chat');
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = question;
            chat.appendChild(userMsg);
            
            document.getElementById('question').value = '';
            
            // Send to server
            fetch('/api/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question, user_id: 'test' })
            })
            .then(r => r.json())
            .then(data => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.textContent = data.answer;
                if (data.related && data.related.length > 0) {
                    const rel = document.createElement('div');
                    rel.style.cssText = 'margin-top:8px;font-size:13px;color:#555;';
                    rel.textContent = 'Related: ' + data.related.map(r => r.topic + ' (' + r.confidence + '%)').join(', ');
                    aiMsg.appendChild(rel);
                }
                chat.appendChild(aiMsg);
                chat.scrollTop = chat.scrollHeight;
            })
            .catch(err => {
                console.log('Error:', err);
                const errMsg = document.createElement('div');
                errMsg.className = 'message ai';
                errMsg.textContent = 'Error: ' + err.message;
                chat.appendChild(errMsg);
            });
        }
    </script>
</body>
</html>
